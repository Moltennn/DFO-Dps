[workspace]
resolver = "2"
members = ["dfo-core"]

# Tests are numeric loops over hundreds of thousands of golden vectors: unoptimised they were ~3x slower and used one
# core for tens of seconds. opt-level 2 keeps overflow checks and debug assertions (the dev profile defaults) and
# changes no float result (no fast-math in Rust); line-tables-only keeps backtraces and shrinks target/ a lot.
[profile.dev]
opt-level = 2
debug = "line-tables-only"

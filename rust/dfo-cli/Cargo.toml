[package]
# The package is the crate; the installed command is `dfo-forge`, the product name (DFO Forge).
name = "dfo-cli"
version = "0.1.0"
edition = "2021"
# `slice::as_chunks` (dfo-core's SPELLS.STD reader) is the newest std call in the workspace: 1.88.
rust-version = "1.88"
description = "DFO Forge: DFO Online combat DPS and build lab, the command line over dfo-core"
license = "MIT"
publish = false

# `cargo install --path rust/dfo-cli` puts this name on PATH.
[[bin]]
name = "dfo-forge"
path = "src/main.rs"

[dependencies]
dfo-core = { path = "../dfo-core" }
# Save discovery parses a user-supplied document; `serde_json` is the parser the workbench import already uses.
# `preserve_order` keeps an object's own key order, which `Value::set` and the JS reads rely on.
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }

[dev-dependencies]
# `tests/common/snapshot.rs` reads the committed snapshot files, which are gzip -9 (`tools/snapshots.mjs record`).
flate2 = "1.1"
